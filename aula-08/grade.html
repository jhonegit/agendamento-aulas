    <!-- ==============================================================
         O AVISO DE PROBLEMA COM O BANCO

         Esta linha nasce escondida, por causa da classe "escondido".
         Ninguém vê ela em dia normal.

         O js/reservas.js só mostra ela quando o banco não responde,
         para a tela não ficar em branco sem explicar o motivo.

         O id serve para o JavaScript achar este pedaço exato da
         página. É o mesmo id que aparece lá no reservas.js.
         ============================================================== -->
    <p class="mensagem mensagem-erro escondido" id="aviso-do-banco"></p>

    <!-- ==============================================================
         A LEGENDA: diz o que cada cor da grade quer dizer.

         Os quadradinhos são os <span class="amostra">. Eles estão
         vazios de propósito: quem dá cor e tamanho a eles é o CSS.
         ============================================================== -->
    <section class="legenda">
      <span class="item-legenda"><span class="amostra amostra-livre"></span> Livre</span>
      <span class="item-legenda"><span class="amostra amostra-biblioteca"></span> Biblioteca ocupada</span>

    </section>
