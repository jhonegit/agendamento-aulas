<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar - Agendamento Escolar</title>

  <!-- Nosso arquivo de estilos -->
  <link rel="stylesheet" href="css/estilo.css">
</head>

<body class="pagina-entrada">

  <main class="cartao-entrada">

    <!-- O cabeçalho é o mesmo nas duas telas, entrar e criar conta -->
    <header class="cabecalho-entrada">
      <h1>Agendamento Escolar</h1>
      <p class="subtitulo">Laboratório de Informática e Biblioteca</p>
    </header>

    <!-- ==============================================================
         AS DUAS ABAS

         São dois botões comuns. Sozinhos eles não fazem nada: quem
         troca uma tela pela outra é o js/autenticacao.js.

         A aba que está valendo agora leva a classe "aba-ativa", que
         é o que deixa ela branca.
         ============================================================== -->
    <div class="abas">
      <button type="button" id="aba-login" class="aba aba-ativa">Entrar</button>
      <button type="button" id="aba-cadastro" class="aba">Criar conta</button>
    </div>

    <!-- ==============================================================
         TELA 1: ENTRAR
         Para quem já tem conta.
         ============================================================== -->
    <form id="formulario-login" class="formulario">

      <label for="email-login">E-mail</label>
      <input type="email" id="email-login" placeholder="professor@escola.br" required>

      <label for="senha-login">Senha</label>
      <input type="password" id="senha-login" placeholder="sua senha" required>

      <button type="submit" class="botao botao-principal">Entrar</button>
    </form>

    <!-- ==============================================================
         TELA 2: CRIAR CONTA
         Para quem ainda não tem.

         Esta tela só aparece depois que alguém clica na aba
         "Criar conta". Antes disso ela fica fora da tela.
         ============================================================== -->
    <form id="formulario-cadastro" class="formulario">

      <label for="nome-cadastro">Nome completo</label>
      <input type="text" id="nome-cadastro" placeholder="Maria da Silva" required>

      <label for="email-cadastro">E-mail</label>
      <input type="email" id="email-cadastro" placeholder="professor@escola.br" required>

      <label for="senha-cadastro">Senha (mínimo 6 caracteres)</label>
      <input type="password" id="senha-cadastro" placeholder="crie uma senha" required>

      <label for="papel-cadastro">Você é</label>
      <select id="papel-cadastro">
        <option value="professor">Professor(a)</option>
        <option value="funcionario">Funcionário(a) da secretaria</option>
      </select>

      <button type="submit" class="botao botao-principal">Criar conta</button>
    </form>

    <!-- ==============================================================
         A CAIXA DE AVISO

         Nasce escondida, igual à do grade.html. É aqui que aparecem
         os erros: senha errada, e-mail inválido, sem internet.
         ============================================================== -->
    <p id="mensagem" class="mensagem escondido"></p>

  </main>


  <!-- ==============================================================
       OS SCRIPTS

       A ORDEM IMPORTA. Cada arquivo usa alguma coisa que o de cima
       criou. Trocar a ordem quebra tudo.
       ============================================================== -->

  <!-- 1. O Firebase em si. Estes três arquivos não são nossos, vêm
          prontos do próprio Google. O do meio é a novidade de hoje:
          é ele que sabe cuidar de conta e senha. -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <!-- 2. O endereço do nosso banco -->
  <script src="js/firebase-config.js"></script>

  <!-- 3. O nosso código de entrar e criar conta -->
  <script src="js/autenticacao.js"></script>


  <!-- O que esta página faz: -->

</body>
</html>
